name: Pre-release (latest commit)

# 每次 push 到 main 自动构建并发布 pre-release，内容为该次 commit message。
# 使用滚动 tag "prelatest"：每次删除重建，不产生 tag 堆积。
on:
  push:
    branches: ['main']

permissions:
  contents: write

concurrency:
  group: prerelease-${{ github.ref }}
  # 同一分支的新 commit 到来时，取消还在跑的上一轮预发布
  cancel-in-progress: true

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_MODULE: androidApp
      API_GATEWAY: ${{ secrets.API_GATEWAY }}
      SIGN_SALT: ${{ secrets.SIGN_SALT }}
      MINI_SIGN_SALT: ${{ secrets.MINI_SIGN_SALT }}
      API_CID: ${{ secrets.API_CID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - uses: gradle/actions/setup-gradle@7ca78c16c887dc6c5f36fd6d0cb0f5c23d940e69 # v6

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          MINI_SIGN_SALT: ${{ secrets.MINI_SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
        run: |
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'SIGN_SALT=%s\n' "$SIGN_SALT" >> secrets.properties
          printf 'MINI_SIGN_SALT=%s\n' "$MINI_SIGN_SALT" >> secrets.properties
          printf 'API_CID=%s\n' "$API_CID" >> secrets.properties
          for f in API_GATEWAY SIGN_SALT MINI_SIGN_SALT API_CID; do
            grep -q "^$f=..*$" secrets.properties || echo "::warning::secrets.$f 未配置——预发布包的签名接口会失败"
          done

      # 有签名 secrets 就出签名 release 包，否则退回 debug 包（保证预发布始终可用）
      - name: Configure release signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prerelease.keystore"
            {
              printf 'signing.storeFile=%s\n' "$RUNNER_TEMP/prerelease.keystore"
              printf 'signing.storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'signing.keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'signing.keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > local.properties
            echo "BUILD_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_DIR=$APP_MODULE/build/outputs/apk/release" >> "$GITHUB_ENV"
          else
            echo "BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_DIR=$APP_MODULE/build/outputs/apk/debug" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        run: ./gradlew "$BUILD_TASK" --no-daemon

      - name: Release notes from commit message
        run: |
          {
            echo "$(git rev-parse --short HEAD)"
            echo ""
            git log -1 --pretty=%B
          } > "$RUNNER_TEMP/prerelease-notes.md"
          cat "$RUNNER_TEMP/prerelease-notes.md"

      - name: Publish pre-release (rolling tag prelatest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' "$APP_MODULE/build.gradle.kts" | head -n 1)"
          SHA="$(git rev-parse --short HEAD)"
          TAG="prelatest"
          TITLE="Pre-release v$VERSION · $SHA"
          ASSETS=$(find "$APK_DIR" -name '*.apk' | sort)
          # 滚动更新：先删旧 release 与其 tag，再重建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" $ASSETS \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/prerelease-notes.md" \
            --prerelease

      - name: Remove signing files
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/prerelease.keystore"
