name: iOS CI and Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
    # 只跳过与 iOS 产物无关的路径。workflow / action 自身的改动**不能**跳过：
    # 否则流水线改错了永远得不到验证（本项目确实这样踩过一次）。
    paths-ignore:
      - 'androidApp/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # 与 android.yml 保持一致：不取消进行中的运行。
  # 此前这里是 true，同 ref 的新提交会中断正在跑的 iOS release，导致发布不完整。
  cancel-in-progress: false

env:
  APP_MODULE: androidApp

jobs:
  validate:
    name: Validate iOS build
    # Fork 默认只自动构建 Android；iOS 仍可手动运行。
    # tag 构建交给下面的 release job，避免同一 tag 编译两次。
    if: ${{ !startsWith(github.ref, 'refs/tags/') && (github.repository == 'ilife798/ilife798' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      # 本地 action 必须先检出仓库才能被解析，故 checkout 在 workflow 侧而非 action 内
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build
        with:
          api-gateway: ${{ secrets.API_GATEWAY }}
          sign-salt: ${{ secrets.SIGN_SALT }}
          mini-sign-salt: ${{ secrets.MINI_SIGN_SALT }}
          ios-sign-salt: ${{ secrets.IOS_SIGN_SALT }}
          api-cid: ${{ secrets.API_CID }}
          secrets-mode: warn
          require-ios-salt: 'true'
          cache-konan: 'true'

      - name: Compile iOS targets
        run: ./gradlew :shared:compileKotlinIosArm64 :shared:compileKotlinIosSimulatorArm64 --stacktrace

      - name: Build unsigned IPA
        run: ./iosApp/scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ilife798-unsigned-ios-ipa
          path: iosApp/build/dist/*.ipa
          if-no-files-found: error

  release:
    name: Build and publish iOS release
    if: github.repository == 'ilife798/ilife798' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build
        with:
          api-gateway: ${{ secrets.API_GATEWAY }}
          sign-salt: ${{ secrets.SIGN_SALT }}
          mini-sign-salt: ${{ secrets.MINI_SIGN_SALT }}
          ios-sign-salt: ${{ secrets.IOS_SIGN_SALT }}
          api-cid: ${{ secrets.API_CID }}
          secrets-mode: fail
          require-ios-salt: 'true'
          cache-konan: 'true'

      # 版本号有两处来源，且发版前必须同时改好：
      #   androidApp/build.gradle.kts 的 versionName → Android 包版本
      #   iosApp/Configuration/Config.xcconfig 的 MARKETING_VERSION → iOS 包版本
      # 此前拆成两个 step 分别校验，任一失败都要重跑整条流水线，合并为一次检查。
      - name: Verify release tag matches app versions
        run: |
          set -euo pipefail
          marketing="$(
            sed -n 's/^MARKETING_VERSION[[:space:]]*=[[:space:]]*\(.*\)/\1/p' \
              iosApp/Configuration/Config.xcconfig | tr -d '[:space:]' | head -n 1
          )"
          app_version="${{ steps.setup.outputs.version-name }}"
          ok=1
          if [ "$GITHUB_REF_NAME" != "v$app_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 androidApp versionName $app_version 不一致"
            ok=0
          fi
          if [ "$GITHUB_REF_NAME" != "v$marketing" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 iOS MARKETING_VERSION $marketing 不一致"
            ok=0
          fi
          test "$ok" = "1"

      - name: Build unsigned IPA
        run: ./iosApp/scripts/build-unsigned-ipa.sh

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ilife798-${{ github.ref_name }}-unsigned-ios-ipa
          path: iosApp/build/dist/*.ipa
          if-no-files-found: error

      # Android 与 iOS 都在同一个 release 上追加产物，谁先跑完谁先建。
      # 这里不指定 --latest：正式发版由 Android job 或人工确认后设定。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 不用 mapfile：macOS runner 自带 bash 3.2，没有该内建命令
          shopt -s nullglob
          assets=("$IPA_DIR"/*.ipa)
          shopt -u nullglob
          test ${#assets[@]} -gt 0 || { echo '::error::没有找到 IPA'; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "$GITHUB_REF_NAME" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          fi
