name: Android CI and Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags: ['v*']
    # workflow 文件本身的改动不需要跑完整构建；iosApp 只影响 iOS 产物
    paths-ignore:
      - 'iosApp/**'
      - '.github/workflows/**'
      - '.github/actions/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: '构建并发布当前版本的签名 APK'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # 不取消进行中的运行：发版（tag push）被打断会留下不完整的 release。
  # 可重复触发的场景（PR 反复提交）交由下面的 pre-release job 用 cancel-in-progress 处理。
  cancel-in-progress: false

env:
  APP_MODULE: androidApp

jobs:
  validate:
    name: Validate Android build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      API_GATEWAY: ${{ secrets.API_GATEWAY }}
      SIGN_SALT: ${{ secrets.SIGN_SALT }}
      MINI_SIGN_SALT: ${{ secrets.MINI_SIGN_SALT }}
      API_CID: ${{ secrets.API_CID }}
    steps:
      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build
        with:
          api-gateway: ${{ secrets.API_GATEWAY }}
          sign-salt: ${{ secrets.SIGN_SALT }}
          mini-sign-salt: ${{ secrets.MINI_SIGN_SALT }}
          api-cid: ${{ secrets.API_CID }}
          secrets-mode: warn

      # tag 构建必须与包内版本号一致，否则发布出去的包版本对不上
      - name: Verify tag matches versionName
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          test "$GITHUB_REF_NAME" = "${{ steps.setup.outputs.app-tag }}" || {
            echo "::error::tag $GITHUB_REF_NAME 与 versionName ${{ steps.setup.outputs.version-name }} 不一致"
            exit 1
          }

      - name: Check formatting, tests and lint
        run: ./gradlew spotlessCheck :shared:testAndroidHostTest :androidApp:lintDebug --no-daemon --stacktrace

      - name: Build debug APKs
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ilife798-debug-apk
          path: ${{ env.APP_MODULE }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build and publish signed Android release
    needs: validate
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      API_GATEWAY: ${{ secrets.API_GATEWAY }}
      SIGN_SALT: ${{ secrets.SIGN_SALT }}
      MINI_SIGN_SALT: ${{ secrets.MINI_SIGN_SALT }}
      API_CID: ${{ secrets.API_CID }}
    steps:
      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build
        with:
          api-gateway: ${{ secrets.API_GATEWAY }}
          sign-salt: ${{ secrets.SIGN_SALT }}
          mini-sign-salt: ${{ secrets.MINI_SIGN_SALT }}
          api-cid: ${{ secrets.API_CID }}
          secrets-mode: fail
          persist-credentials: 'false'

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          names = ['ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS', 'ANDROID_KEY_PASSWORD']
          for name in names:
              if not os.environ.get(name):
                  raise SystemExit(f'Missing signing secret: {name}')
          key = Path(os.environ['RUNNER_TEMP']) / 'ilife798-release.jks'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          def escape(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')
          values = {'signing.storeFile': str(key), 'signing.storePassword': os.environ['ANDROID_KEYSTORE_PASSWORD'],
                    'signing.keyAlias': os.environ['ANDROID_KEY_ALIAS'], 'signing.keyPassword': os.environ['ANDROID_KEY_PASSWORD']}
          Path('local.properties').write_text(''.join(f'{k}={escape(v)}\n' for k, v in values.items()), encoding='ascii')
          PY

      - name: Build signed release APKs
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Verify signatures and generate checksums
        run: |
          set -euo pipefail
          # build-tools 版本由 setup-build 解析，不再硬编码（原写死 36.0.0）
          apksigner="$ANDROID_HOME/build-tools/${{ steps.setup.outputs.build-tools }}/apksigner"
          test -x "$apksigner" || { echo "::error::找不到 apksigner: $apksigner"; exit 1; }
          for apk in "${APK_RELEASE_DIR}"/*.apk; do
            "$apksigner" verify --verbose --print-certs "$apk"
          done
          (cd "$APK_RELEASE_DIR" && sha256sum ./*.apk > SHA256SUMS.txt)

      - name: Upload R8 mapping
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ilife798-${{ steps.setup.outputs.app-tag }}-r8-mapping
          path: ${{ env.APP_MODULE }}/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # release notes 改由 GitHub 按 PR/commit 历史自动生成。
      # 原先写死在 heredoc 里的文案描述的是历史功能，与当次构建无关，每次发版都一样。
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.setup.outputs.app-tag }}
        run: |
          set -euo pipefail
          assets=("${APK_RELEASE_DIR}"/*.apk "${APK_RELEASE_DIR}/SHA256SUMS.txt")
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # iOS job 可能已先创建了 release，这里只补传 Android 产物
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes
          fi

      - name: Remove signing files
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/ilife798-release.jks"

  # 原先独立的 prerelease.yml。合并进来后可复用同一套 setup，
  # 也不必再维护第二份 secrets 生成逻辑。
  # 连续提交的重复构建由 workflow 级 concurrency 串行化，无需在此再设一套。
  pre-release:
    name: Pre-release (latest commit)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      API_GATEWAY: ${{ secrets.API_GATEWAY }}
      SIGN_SALT: ${{ secrets.SIGN_SALT }}
      MINI_SIGN_SALT: ${{ secrets.MINI_SIGN_SALT }}
      API_CID: ${{ secrets.API_CID }}
    steps:
      - name: Set up build environment
        id: setup
        uses: ./.github/actions/setup-build
        with:
          api-gateway: ${{ secrets.API_GATEWAY }}
          sign-salt: ${{ secrets.SIGN_SALT }}
          mini-sign-salt: ${{ secrets.MINI_SIGN_SALT }}
          api-cid: ${{ secrets.API_CID }}
          secrets-mode: warn
          persist-credentials: 'false'

      # 有签名密钥就出签名包，否则退回 debug 包（保证预发布始终可用）
      - name: Configure release signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/prerelease.keystore"
            {
              printf 'signing.storeFile=%s\n' "$RUNNER_TEMP/prerelease.keystore"
              printf 'signing.storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
              printf 'signing.keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
              printf 'signing.keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
            } > local.properties
            echo "BUILD_TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK_DIR=$APK_RELEASE_DIR" >> "$GITHUB_ENV"
          else
            echo "BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK_DIR=$APK_DEBUG_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build APKs
        run: ./gradlew "$BUILD_TASK" --no-daemon

      - name: Release notes from commit message
        run: |
          {
            echo "$(git rev-parse --short HEAD)"
            echo ""
            git log -1 --pretty=%B
          } > "$RUNNER_TEMP/prerelease-notes.md"
          cat "$RUNNER_TEMP/prerelease-notes.md"

      - name: Publish pre-release (rolling tag prelatest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          TAG="prelatest"
          TITLE="Pre-release v${{ steps.setup.outputs.version-name }} · $SHA"
          mapfile -t assets < <(find "$APK_DIR" -name '*.apk' | sort)
          test ${#assets[@]} -gt 0 || { echo '::error::没有找到 APK'; exit 1; }
          # 滚动更新：先删旧 release 与其 tag，再重建
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file "$RUNNER_TEMP/prerelease-notes.md" \
            --prerelease

      - name: Remove signing files
        if: always()
        run: rm -f local.properties "$RUNNER_TEMP/prerelease.keystore"
