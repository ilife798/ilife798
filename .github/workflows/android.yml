name: Android CI and Release

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    tags:
      - 'v*'
    paths-ignore:
      - 'iosApp/**'
      - '.github/workflows/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  APP_MODULE: androidApp

jobs:
  validate:
    name: Validate Android build
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          MINI_SIGN_SALT: ${{ secrets.MINI_SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
        run: |
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'SIGN_SALT=%s\n' "$SIGN_SALT" >> secrets.properties
          printf 'MINI_SIGN_SALT=%s\n' "$MINI_SIGN_SALT" >> secrets.properties
          printf 'API_CID=%s\n' "$API_CID" >> secrets.properties
          # 缺密钥时构建仍然成功，但积分/签到等需要签名的接口必然验签失败（服务端返回 code=-1 请升级最新版APP）。
          # 这里显式告警，避免再次产出「能装但功能不可用」的包。
          # SIGN_SALT 管 App 通道（1,1），MINI_SIGN_SALT 管小程序通道（1,5），两者不可互换。
          for f in API_GATEWAY SIGN_SALT MINI_SIGN_SALT API_CID; do
            grep -q "^$f=..*$" secrets.properties || echo "::warning::secrets.$f 未配置——构建可用，但需签名的接口会验签失败"
          done

      - name: Check formatting, tests and lint
        run: ./gradlew spotlessCheck testAndroidHostTest lintDebug --no-daemon --stacktrace

      - name: Build debug APKs
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload debug APKs
        uses: actions/upload-artifact@v7
        with:
          name: ilife798-debug-apk
          path: ${{ env.APP_MODULE }}/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  release:
    name: Build and publish Android release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform
        run: sdkmanager 'platforms;android-37.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify release tag matches app version
        run: |
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' "$APP_MODULE/build.gradle.kts" | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$version_name"

      - name: Generate secrets.properties
        env:
          API_GATEWAY: ${{ secrets.API_GATEWAY }}
          SIGN_SALT: ${{ secrets.SIGN_SALT }}
          MINI_SIGN_SALT: ${{ secrets.MINI_SIGN_SALT }}
          API_CID: ${{ secrets.API_CID }}
        run: |
          printf 'API_GATEWAY=%s\n' "$API_GATEWAY" > secrets.properties
          printf 'SIGN_SALT=%s\n' "$SIGN_SALT" >> secrets.properties
          printf 'MINI_SIGN_SALT=%s\n' "$MINI_SIGN_SALT" >> secrets.properties
          printf 'API_CID=%s\n' "$API_CID" >> secrets.properties
          # 缺密钥时构建仍然成功，但积分/签到等需要签名的接口必然验签失败（服务端返回 code=-1 请升级最新版APP）。
          # 这里显式告警，避免再次产出「能装但功能不可用」的包。
          # SIGN_SALT 管 App 通道（1,1），MINI_SIGN_SALT 管小程序通道（1,5），两者不可互换。
          for f in API_GATEWAY SIGN_SALT MINI_SIGN_SALT API_CID; do
            grep -q "^$f=..*$" secrets.properties || echo "::warning::secrets.$f 未配置——构建可用，但需签名的接口会验签失败"
          done

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          {
            printf 'signing.storeFile=%s\n' "$RUNNER_TEMP/release.keystore"
            printf 'signing.storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'signing.keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'signing.keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > local.properties

      - name: Run tests and build signed release APKs
        run: ./gradlew testAndroidHostTest assembleRelease --no-daemon --stacktrace

      - name: Verify release APK signatures
        run: |
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          for apk in "$APP_MODULE"/build/outputs/apk/release/*.apk; do
            "$apksigner" verify --print-certs "$apk"
          done

      - name: Preserve R8 mapping
        uses: actions/upload-artifact@v7
        with:
          name: ilife798-${{ github.ref_name }}-r8-mapping
          path: ${{ env.APP_MODULE }}/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=("$APP_MODULE"/build/outputs/apk/release/*.apk)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            # iOS 工作流可能已抢先创建同名 release，创建失败时改为上传
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" --generate-notes \
              || gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          fi
